<title>SERSAN preloader — choreography harness</title>
<style>
  :root { --accent: 189 100% 62%; --accent-2: 216 100% 58%; --ink: 220 38% 97%; }
  body { margin: 0; background: #0B1422; color: #8A94A6;
         font: 12px/1.5 ui-monospace, monospace; letter-spacing: .12em; }
  .wrap { min-height: 100vh; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 34px; }
  svg { overflow: visible; height: 178px; width: auto; }
  .pct { color: #F4F6FA; font-size: 34px; letter-spacing: -.01em; }
  .ctl { display: flex; gap: 18px; align-items: center; }
  button { background: #16233b; color: #F4F6FA; border: 1px solid #24365a;
           padding: 7px 14px; border-radius: 5px; font: inherit; cursor: pointer; }
  input { width: 320px; }
</style>

<div class="wrap">
  <svg id="mark" viewBox="-110 -66 382.38 332" role="img" aria-label="SERSAN">
    <defs>
      <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="hsl(var(--accent))"/>
        <stop offset="100%" stop-color="hsl(var(--accent-2))"/>
      </linearGradient>
      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="hsl(189 100% 62%)" flood-opacity="0.55"/>
      </filter>
      <filter id="seamglow" x="-45%" y="-45%" width="190%" height="190%">
        <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="hsl(189 100% 62%)" flood-opacity="0.9"/>
      </filter>
      <clipPath id="reveal"><rect id="fillrect" x="-110" y="-66" width="0" height="332"/></clipPath>
    </defs>

    <g id="seamWrap">
      <path id="seam" fill="hsl(var(--accent))" filter="url(#seamglow)" opacity="0"
        d="M 162.38 46.88 L 127.3 67.13 L 81.19 40.51 L 39.64 64.49 L 39.64 90.03 L 80.11 113.4 L 40.6 136.21 L 0 112.78 L 0 153.13 L 35.08 132.87 L 81.19 159.49 L 122.73 135.51 L 122.73 109.97 L 82.27 86.6 L 121.78 63.79 L 162.38 87.22 Z"/>
    </g>

    <g id="ghostWrap">
      <g id="ug"><path fill="hsl(var(--ink) / 0.14)"
        d="M 81.19 0 L 162.38 46.88 L 127.3 67.13 L 81.19 40.51 L 39.64 64.49 L 39.64 90.03 L 80.11 113.4 L 40.6 136.21 L 0 112.78 L 0 46.88 Z"/></g>
      <g id="lg"><path fill="hsl(var(--ink) / 0.14)"
        d="M 81.19 200 L 0 153.13 L 35.08 132.87 L 81.19 159.49 L 122.73 135.51 L 122.73 109.97 L 82.27 86.6 L 121.78 63.79 L 162.38 87.22 L 162.38 153.13 Z"/></g>
    </g>

    <g id="litWrap" clip-path="url(#reveal)" filter="url(#glow)">
      <g id="ul"><path fill="url(#fill)"
        d="M 81.19 0 L 162.38 46.88 L 127.3 67.13 L 81.19 40.51 L 39.64 64.49 L 39.64 90.03 L 80.11 113.4 L 40.6 136.21 L 0 112.78 L 0 46.88 Z"/></g>
      <g id="ll"><path fill="url(#fill)"
        d="M 81.19 200 L 0 153.13 L 35.08 132.87 L 81.19 159.49 L 122.73 135.51 L 122.73 109.97 L 82.27 86.6 L 121.78 63.79 L 162.38 87.22 L 162.38 153.13 Z"/></g>
    </g>
  </svg>

  <div class="pct"><span id="pct">0</span><span style="font-size:16px"> %</span></div>
  <div class="ctl">
    <button id="play">replay load</button>
    <button id="lock">fire lock</button>
    <label>progress <input id="slider" type="range" min="0" max="100" value="0"></label>
  </div>
  <div>SPLIT_AXIS −30° · SPLIT_CYCLE 2.6s · SPLIT_FLOOR 0.34 · SEAM_RANGE 22</div>
</div>

<script>
  // Mirrors src/components/fx/preloader.tsx exactly: same constants, same
  // envelopes, same applySplit(). Lets the choreography be judged without a
  // dev server (Next refuses a second one inside this repo).
  const AX = { x: Math.sqrt(3) / 2, y: 0.5 };
  const SPLIT_MAX = 78, SPLIT_CYCLE = 2.6, SPLIT_FLOOR = 0.34;
  const SEAM_RANGE = 22, SEAM_PEAK = 0.8;
  const ENTRY_S = 0.9, ENTRY_OVERSHOOT = 0.55, LOCK_PULL = 34, VB_W = 382.38;

  const $ = (id) => document.getElementById(id);
  const state = { gap: SPLIT_MAX, boost: 0 };

  function applySplit() {
    const dx = AX.x * state.gap, dy = AX.y * state.gap;
    const up = "translate(" + -dx + " " + -dy + ")";
    const down = "translate(" + dx + " " + dy + ")";
    $("ug").setAttribute("transform", up);
    $("ul").setAttribute("transform", up);
    $("lg").setAttribute("transform", down);
    $("ll").setAttribute("transform", down);
    const close = Math.max(0, 1 - state.gap / SEAM_RANGE);
    $("seam").setAttribute("opacity", Math.min(1, close * close * SEAM_PEAK + state.boost).toFixed(3));
    return close;
  }

  let t0 = performance.now(), current = 0, locked = false, manual = false;
  function frame(now) {
    const tSec = (now - t0) / 1000;
    if (!locked) {
      if (!manual) {
        const target = Math.min(1, tSec / 7);           // stand-in for readiness
        current += (target - current) * 0.12;
        if (current > 0.995) current = 1;
        $("slider").value = Math.round(current * 100);
      }
      $("pct").textContent = Math.round(current * 100);
      $("fillrect").setAttribute("width", String(VB_W * current));
      const entry = Math.min(1, tSec / ENTRY_S);
      const settle = 1 + ENTRY_OVERSHOOT * Math.pow(1 - entry, 3);
      const breath = 0.5 + 0.5 * Math.cos((tSec / SPLIT_CYCLE) * Math.PI * 2);
      state.gap = SPLIT_MAX * (SPLIT_FLOOR + (1 - SPLIT_FLOOR) * (1 - current)) * breath * settle;
      applySplit();
      if (!manual && current >= 1) fireLock();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Minimal tween runner so the harness needs no GSAP: same durations/offsets
  // and equivalent easings to the reveal timeline.
  const easings = {
    "power2.out": (t) => 1 - Math.pow(1 - t, 2),
    "power4.out": (t) => 1 - Math.pow(1 - t, 4),
    "power2.in": (t) => t * t,
  };
  function tween(key, to, dur, ease, delay) {
    const from = state[key], e = easings[ease], start = performance.now() + delay * 1000;
    (function step(now) {
      const p = Math.min(1, Math.max(0, (now - start) / (dur * 1000)));
      if (now >= start) { state[key] = from + (to - from) * e(p); applySplit(); }
      if (p < 1) requestAnimationFrame(step);
    })(performance.now());
  }
  function fireLock() {
    if (locked) return;
    locked = true;
    $("fillrect").setAttribute("width", String(VB_W));
    $("pct").textContent = "100";
    tween("gap", LOCK_PULL, 0.18, "power2.out", 0);
    tween("gap", 0, 0.46, "power4.out", 0.18);
    tween("boost", 1, 0.16, "power2.in", 0.5);
    tween("boost", 0, 0.55, "power2.out", 0.66);
    setTimeout(() => { $("seam").style.fill = "#EAF9FF"; }, 500);
    setTimeout(() => { $("seam").style.fill = ""; }, 830);
    setTimeout(() => { $("ghostWrap").style.transition = "opacity .32s"; $("ghostWrap").style.opacity = 0; }, 300);
  }

  $("play").onclick = () => {
    locked = false; manual = false; current = 0; state.boost = 0;
    $("ghostWrap").style.opacity = 1; $("seam").style.fill = "";
    t0 = performance.now();
  };
  $("lock").onclick = fireLock;
  $("slider").oninput = (e) => {
    manual = true; locked = false; current = e.target.value / 100;
    $("pct").textContent = e.target.value;
  };
</script>
