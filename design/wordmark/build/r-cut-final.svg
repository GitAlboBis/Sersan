<text x="80" y="58" font-family="ui-monospace,Consolas,'Courier New',monospace" font-size="16" fill="#0B1422" letter-spacing="3">SERSAN DISPLAY · THE R CUT AS IT NOW SHIPS · WEIGHT 340 · R AT CAP 320PX, ONE SCALE AND ONE BASELINE</text>
<text x="80" y="88" font-family="ui-monospace,Consolas,'Courier New',monospace" font-size="12.5" fill="#8A8378" letter-spacing="1.1">UPM 1000 · CAP 700 · STEM 68u · BOTH RS READ BACK OUT OF REAL woff2 FILES, NOT REBUILT · EVERY FIGURE MEASURED ON THOSE OUTLINES</text>
<text x="80" y="110" font-family="ui-monospace,Consolas,'Courier New',monospace" font-size="12.5" fill="#8A8378" letter-spacing="1.1">THE PALE SHAPE BEHIND EACH R IS THE UNTOUCHED JOST R — WHAT READS PALE IS THE INK THE CUT REMOVES</text>
<text x="80" y="132" font-family="ui-monospace,Consolas,'Courier New',monospace" font-size="12.5" fill="#8A8378" letter-spacing="1.1">THE LEG LETS GO AT 161u AND THE BAND SATURATES AT 284u: BEFORE STOPS SHORT OF THE FIRST, AFTER GOES PAST THE SECOND — WIDER WOULD REMOVE NOTHING MORE</text>
