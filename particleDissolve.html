<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Dissolve — GPGPU (stile Lusion DDD)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060d; }
  body {
    background: radial-gradient(120% 90% at 50% 40%, #0c1430 0%, #05060d 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  #hint {
    position: fixed; left: 18px; bottom: 16px;
    color: #7d8bb5; font-size: 12px; letter-spacing: .3px;
    pointer-events: none; user-select: none; line-height: 1.5;
  }
  #hint b { color: #b9c6f2; font-weight: 600; }
  #err {
    position: fixed; inset: 0; display: none; place-items: center;
    color: #ff8a8a; font-size: 14px; text-align: center; padding: 24px;
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="hint">Muovi il <b>mouse</b> sulla D per disperdere le particelle &nbsp;•&nbsp; <b>trascina</b> per ruotare</div>
  <div id="err"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  (function () {
    "use strict";

    // ----------------------------------------------------------------------
    // PARAMETRI DA SMANETTARE  (tutti i numeri "del look" sono qui)
    // ----------------------------------------------------------------------
    const SIZE        = 256;    // texture NxN  ->  N*N particelle (256 = 65.536)
    const SPRING      = 26.0;   // forza della molla verso la "casa" (rigenerazione)
    const DAMPING     = 4.5;    // attrito: piu' alto = si fermano prima
    const PUSH        = 42.0;   // forza con cui il mouse spinge via le particelle
    const RADIUS      = 0.52;   // raggio d'influenza del mouse (in unita' modello)
    const MAX_SPEED   = 4.0;    // velocita' massima (evita esplosioni)
    const TURB_BASE   = 0.35;   // turbolenza a riposo (shimmer "vivo")
    const TURB_MOVE   = 1.2;    // turbolenza extra quando la particella e' lontana da casa
    const POINT_SIZE  = 7.0;    // dimensione base dei punti
    const COL_COLD    = [0.42, 0.30, 0.86]; // viola (a riposo)
    const COL_HOT     = [0.28, 0.95, 0.95]; // ciano (in movimento)
    const AUTO_ROT    = 0.12;   // rotazione automatica quando non trascini (rad/s)

    const app = document.getElementById("app");

    // ----------------------------------------------------------------------
    // RENDERER / SCENA / CAMERA
    // ----------------------------------------------------------------------
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    const PR = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(PR);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x05060d, 1);
    app.appendChild(renderer.domElement);

    // Controllo di sicurezza: serve il supporto a render target float (GPGPU)
    const gl = renderer.getContext();
    const okFloat = (renderer.capabilities.isWebGL2 && gl.getExtension("EXT_color_buffer_float"))
                 || gl.getExtension("WEBGL_color_buffer_float");
    if (!okFloat) {
      document.getElementById("err").style.display = "grid";
      document.getElementById("err").textContent =
        "Il tuo browser/GPU non supporta i render target float necessari per la simulazione GPGPU.";
      return;
    }

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 3);
    camera.lookAt(0, 0, 0);

    // Tutte le particelle stanno dentro questo gruppo: lo ruotiamo noi.
    const group = new THREE.Group();
    scene.add(group);

    // ======================================================================
    // 1) POSIZIONI "CASA"  ->  qui generi i punti del TUO modello
    // ======================================================================
    //
    //  >>>>>>>>>>>>>>>>>>  SOSTITUISCI QUESTA FUNZIONE  <<<<<<<<<<<<<<<<<<
    //
    //  Nel TUO progetto, invece di generare una "D" a mano, campioni N punti
    //  sulla SUPERFICIE del tuo modello con MeshSurfaceSampler (addon Three.js):
    //
    //     import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
    //     const sampler = new MeshSurfaceSampler(tuaMesh).build();
    //     const tmp = new THREE.Vector3();
    //     for (let k = 0; k < SIZE*SIZE; k++) {
    //       sampler.sample(tmp);                 // punto casuale sulla superficie
    //       data[k*4+0] = tmp.x;
    //       data[k*4+1] = tmp.y;
    //       data[k*4+2] = tmp.z;
    //       data[k*4+3] = 1.0;
    //     }
    //
    //  Tutto il resto del codice rimane IDENTICO.
    // ----------------------------------------------------------------------
    function makeHomePositions(count) {
      const data = new Float32Array(count * 4);
      // Geometria analitica di una "D": bordo sinistro dritto + pancia ellittica
      const yT = 0.95, xL = -0.72, outW = 1.5;          // contorno esterno
      const xIn = -0.40, inW = 1.05, yIn = 0.62;        // foro interno (la "contropunzione")
      const zHalf = 0.18;                               // estrusione in profondita'

      function insideD(x, y) {
        if (y < -yT || y > yT || x < xL) return false;
        const t = 1.0 - (y / yT) * (y / yT);
        if (t < 0) return false;
        if (x > xL + outW * Math.sqrt(t)) return false;            // fuori dal contorno
        if (y > -yIn && y < yIn && x > xIn) {                      // zona del foro
          const ti = 1.0 - (y / yIn) * (y / yIn);
          if (ti > 0 && x < xIn + inW * Math.sqrt(ti)) return false; // dentro il foro -> scarta
        }
        return true;
      }

      let i = 0;
      const xMax = xL + outW; // ~0.78
      while (i < count) {
        const x = xL + Math.random() * (xMax - xL);
        const y = -yT + Math.random() * (2 * yT);
        if (!insideD(x, y)) continue;
        const z = (Math.random() * 2 - 1) * zHalf;
        // piccolo "fuzz" per l'aspetto vellutato
        data[i*4+0] = x + (Math.random()*2-1) * 0.02;
        data[i*4+1] = y + (Math.random()*2-1) * 0.02;
        data[i*4+2] = z + (Math.random()*2-1) * 0.02;
        data[i*4+3] = 1.0;
        i++;
      }
      return data;
    }

    const homeData = makeHomePositions(SIZE * SIZE);

    // Texture statica con le posizioni "casa" (target della molla)
    const originTex = new THREE.DataTexture(homeData, SIZE, SIZE, THREE.RGBAFormat, THREE.FloatType);
    originTex.minFilter = THREE.NearestFilter;
    originTex.magFilter = THREE.NearestFilter;
    originTex.needsUpdate = true;

    // ======================================================================
    // 2) GPGPU: 4 render target float (ping-pong) per posizioni e velocita'
    // ======================================================================
    function makeRT() {
      return new THREE.WebGLRenderTarget(SIZE, SIZE, {
        minFilter: THREE.NearestFilter,
        magFilter: THREE.NearestFilter,
        format: THREE.RGBAFormat,
        type: THREE.FloatType,
        depthBuffer: false,
        stencilBuffer: false,
      });
    }
    let posCur = makeRT(), posNext = makeRT();
    let velCur = makeRT(), velNext = makeRT();

    // Scena "finta" 2D per eseguire le passate di simulazione su un quad
    const simScene  = new THREE.Scene();
    const simCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
    simScene.add(quad);

    const SIM_VERT = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;

    // --- shader VELOCITA': qui vivono molla + repulsione + turbolenza ---
    const velMat = new THREE.ShaderMaterial({
      uniforms: {
        positions:  { value: null },
        velocities: { value: null },
        origin:     { value: originTex },
        uMouse:     { value: new THREE.Vector3(999, 999, 999) }, // mouse in spazio MODELLO
        uTime:      { value: 0 },
        uDt:        { value: 0 },
        uSpring:    { value: SPRING },
        uDamping:   { value: DAMPING },
        uPush:      { value: PUSH },
        uRadius:    { value: RADIUS },
        uMaxSpeed:  { value: MAX_SPEED },
        uTurbBase:  { value: TURB_BASE },
        uTurbMove:  { value: TURB_MOVE },
      },
      vertexShader: SIM_VERT,
      fragmentShader: `
        uniform sampler2D positions;
        uniform sampler2D velocities;
        uniform sampler2D origin;
        uniform vec3  uMouse;
        uniform float uTime, uDt, uSpring, uDamping, uPush, uRadius, uMaxSpeed, uTurbBase, uTurbMove;
        varying vec2 vUv;

        void main() {
          vec3 pos  = texture2D(positions,  vUv).xyz;
          vec3 vel  = texture2D(velocities, vUv).xyz;
          vec3 home = texture2D(origin,     vUv).xyz;

          // (a) MOLLA elastica verso casa  ->  rigenerazione
          vec3 toHome = home - pos;
          vec3 acc = toHome * uSpring;

          // (b) REPULSIONE dal mouse entro un raggio  ->  dispersione
          vec3 fromMouse = pos - uMouse;
          float d = length(fromMouse);
          if (d < uRadius) {
            float f = 1.0 - d / uRadius;        // 1 al centro, 0 al bordo
            acc += normalize(fromMouse + 1e-5) * (f * f) * uPush;
          }

          // (c) TURBOLENZA: poca a riposo, di piu' quando la particella e' lontana
          float disp = clamp(length(toHome) * 3.0, 0.0, 1.0);
          vec3 turb = vec3(
            sin(pos.y * 6.0 + uTime * 1.3),
            sin(pos.z * 6.0 + uTime * 1.7),
            sin(pos.x * 6.0 + uTime * 1.1)
          );
          acc += turb * (uTurbBase + uTurbMove * disp);

          // integrazione + attrito + clamp velocita'
          vel += acc * uDt;
          vel *= exp(-uDamping * uDt);
          float sp = length(vel);
          if (sp > uMaxSpeed) vel *= uMaxSpeed / sp;

          gl_FragColor = vec4(vel, 1.0);
        }
      `,
    });

    // --- shader POSIZIONE: integra la velocita' ---
    const posMat = new THREE.ShaderMaterial({
      uniforms: {
        positions:  { value: null },
        velocities: { value: null },
        uDt:        { value: 0 },
      },
      vertexShader: SIM_VERT,
      fragmentShader: `
        uniform sampler2D positions;
        uniform sampler2D velocities;
        uniform float uDt;
        varying vec2 vUv;
        void main() {
          vec3 pos = texture2D(positions,  vUv).xyz;
          vec3 vel = texture2D(velocities, vUv).xyz;
          pos += vel * uDt;
          gl_FragColor = vec4(pos, 1.0);
        }
      `,
    });

    // --- shader di inizializzazione (seeding dei render target) ---
    const initPosMat = new THREE.ShaderMaterial({
      uniforms: { src: { value: originTex } },
      vertexShader: SIM_VERT,
      fragmentShader: `uniform sampler2D src; varying vec2 vUv;
        void main(){ gl_FragColor = texture2D(src, vUv); }`,
    });
    const initVelMat = new THREE.ShaderMaterial({
      vertexShader: SIM_VERT,
      fragmentShader: `void main(){ gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); }`,
    });

    function renderToRT(mat, rt) {
      quad.material = mat;
      renderer.setRenderTarget(rt);
      renderer.render(simScene, simCamera);
      renderer.setRenderTarget(null);
    }
    // seed: posizioni = casa, velocita' = 0  (i RT nascono con contenuto "sporco")
    renderToRT(initPosMat, posCur);
    renderToRT(initPosMat, posNext);
    renderToRT(initVelMat, velCur);
    renderToRT(initVelMat, velNext);

    // ======================================================================
    // 3) PUNTI DA DISEGNARE (leggono la posizione dalla texture nel vertex shader)
    // ======================================================================
    const N = SIZE * SIZE;
    const refs = new Float32Array(N * 3);     // (u, v, random) per ogni particella
    const dummy = new Float32Array(N * 3);    // attributo 'position' fittizio
    for (let k = 0; k < N; k++) {
      refs[k*3+0] = ((k % SIZE) + 0.5) / SIZE;
      refs[k*3+1] = (Math.floor(k / SIZE) + 0.5) / SIZE;
      refs[k*3+2] = Math.random();
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(dummy, 3));
    geo.setAttribute("ref",      new THREE.BufferAttribute(refs, 3));

    const pointsMat = new THREE.ShaderMaterial({
      uniforms: {
        positionTex: { value: posCur.texture },
        velocityTex: { value: velCur.texture },
        uSize:       { value: POINT_SIZE },
        uPR:         { value: PR },
        uCold:       { value: new THREE.Vector3(...COL_COLD) },
        uHot:        { value: new THREE.Vector3(...COL_HOT) },
      },
      vertexShader: `
        attribute vec3 ref;
        uniform sampler2D positionTex;
        uniform sampler2D velocityTex;
        uniform float uSize, uPR;
        varying float vSpeed;
        varying float vRand;
        void main() {
          vec3 p = texture2D(positionTex, ref.xy).xyz;
          vSpeed = length(texture2D(velocityTex, ref.xy).xyz);
          vRand  = ref.z;
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = uSize * uPR * (0.6 + 0.8 * ref.z) / max(-mv.z, 0.001);
        }
      `,
      fragmentShader: `
        uniform vec3 uCold;
        uniform vec3 uHot;
        varying float vSpeed;
        varying float vRand;
        void main() {
          // punto rotondo morbido
          vec2 c = gl_PointCoord - 0.5;
          float r = length(c);
          if (r > 0.5) discard;
          float a = smoothstep(0.5, 0.05, r);

          // colore guidato dalla velocita': viola (fermo) -> ciano (veloce)
          float t = clamp(vSpeed * 0.6, 0.0, 1.0);
          vec3 col = mix(uCold, uHot, t);
          col *= (1.0 + vSpeed * 0.35);             // i veloci brillano di piu'
          col *= (0.7 + 0.5 * vRand);               // leggera varianza per punto

          gl_FragColor = vec4(col, a * 0.55);
        }
      `,
      transparent: true,
      depthTest: false,
      depthWrite: false,
      blending: THREE.AdditiveBlending,            // <- il glow nasce da qui
    });

    const points = new THREE.Points(geo, pointsMat);
    points.frustumCulled = false;                  // la 'position' e' fittizia
    group.add(points);

    // ======================================================================
    // 4) MOUSE  ->  punto in spazio MODELLO (cosi' funziona anche se ruoti)
    // ======================================================================
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2(2, 2);           // fuori schermo all'avvio
    let pointerInside = false;

    function updatePointer(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      ndc.x = ((e.clientX - rect.left) / rect.width)  * 2 - 1;
      ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      pointerInside = true;
    }
    renderer.domElement.addEventListener("pointermove", updatePointer);
    renderer.domElement.addEventListener("pointerleave", () => { pointerInside = false; });

    // piano su cui proiettare il mouse (passa per l'origine, rivolto alla camera)
    const planeNormal = new THREE.Vector3();
    const plane = new THREE.Plane();
    const hitWorld = new THREE.Vector3();
    const mouseLocal = new THREE.Vector3(999, 999, 999);

    function computeMouseLocal() {
      if (!pointerInside) { mouseLocal.set(999, 999, 999); return; }
      camera.getWorldDirection(planeNormal);
      plane.setFromNormalAndCoplanarPoint(planeNormal, new THREE.Vector3(0, 0, 0));
      raycaster.setFromCamera(ndc, camera);
      if (raycaster.ray.intersectPlane(plane, hitWorld)) {
        group.updateMatrixWorld();
        mouseLocal.copy(group.worldToLocal(hitWorld.clone())); // mondo -> spazio modello
      } else {
        mouseLocal.set(999, 999, 999);
      }
    }

    // trascinamento per ruotare
    let dragging = false, lastX = 0, lastY = 0;
    let rotX = 0, rotY = 0;
    renderer.domElement.addEventListener("pointerdown", (e) => {
      dragging = true; lastX = e.clientX; lastY = e.clientY;
    });
    window.addEventListener("pointerup", () => { dragging = false; });
    window.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      rotY += (e.clientX - lastX) * 0.005;
      rotX += (e.clientY - lastY) * 0.005;
      rotX = Math.max(-1.0, Math.min(1.0, rotX));
      lastX = e.clientX; lastY = e.clientY;
    });

    // ======================================================================
    // 5) LOOP: simula sulla GPU (ping-pong) e disegna
    // ======================================================================
    function simulate(dt, time) {
      // passata VELOCITA': legge posCur+velCur -> scrive velNext
      velMat.uniforms.positions.value  = posCur.texture;
      velMat.uniforms.velocities.value = velCur.texture;
      velMat.uniforms.uMouse.value.copy(mouseLocal);
      velMat.uniforms.uTime.value = time;
      velMat.uniforms.uDt.value   = dt;
      renderToRT(velMat, velNext);

      // passata POSIZIONE: legge posCur+velNext -> scrive posNext
      posMat.uniforms.positions.value  = posCur.texture;
      posMat.uniforms.velocities.value = velNext.texture;
      posMat.uniforms.uDt.value = dt;
      renderToRT(posMat, posNext);

      // swap dei buffer
      let tp = posCur; posCur = posNext; posNext = tp;
      let tv = velCur; velCur = velNext; velNext = tv;

      // il render dei punti legge i buffer aggiornati
      pointsMat.uniforms.positionTex.value = posCur.texture;
      pointsMat.uniforms.velocityTex.value = velCur.texture;
    }

    const clock = new THREE.Clock();
    function loop() {
      requestAnimationFrame(loop);
      const dt = Math.min(clock.getDelta(), 0.033); // clamp per stabilita'
      const t  = clock.elapsedTime;

      if (!dragging) rotY += AUTO_ROT * dt;          // rotazione automatica
      group.rotation.x = rotX;
      group.rotation.y = rotY;

      computeMouseLocal();
      simulate(dt, t);
      renderer.render(scene, camera);
    }
    loop();

    // resize
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  })();
  </script>
</body>
</html>
