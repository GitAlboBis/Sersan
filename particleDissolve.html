<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Dissolve v2 — due strati (corpo viola + pelle ciano)</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #04050b;
        }

        body {
            background: radial-gradient(120% 90% at 50% 42%, #0b1230 0%, #04050b 72%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #app {
            position: fixed;
            inset: 0;
        }

        #hint {
            position: fixed;
            left: 18px;
            bottom: 16px;
            color: #7d8bb5;
            font-size: 12px;
            letter-spacing: .3px;
            pointer-events: none;
            user-select: none;
            line-height: 1.5;
        }

        #hint b {
            color: #b9c6f2;
            font-weight: 600;
        }

        #err {
            position: fixed;
            inset: 0;
            display: none;
            place-items: center;
            color: #ff8a8a;
            font-size: 14px;
            text-align: center;
            padding: 24px;
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <div id="hint">Muovi il <b>mouse</b> sulla D &nbsp;•&nbsp; <b>trascina</b> per ruotare &nbsp;•&nbsp; corpo viola
        denso + pelle ciano reattiva</div>
    <div id="err"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        (function () {
            "use strict";

            const app = document.getElementById("app");

            // ----- RENDERER / SCENA / CAMERA -----
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            const PR = Math.min(window.devicePixelRatio || 1, 2);
            renderer.setPixelRatio(PR);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x04050b, 1);
            app.appendChild(renderer.domElement);

            const gl = renderer.getContext();
            const okFloat = (renderer.capabilities.isWebGL2 && gl.getExtension("EXT_color_buffer_float"))
                || gl.getExtension("WEBGL_color_buffer_float");
            if (!okFloat) {
                const e = document.getElementById("err");
                e.style.display = "grid";
                e.textContent = "Browser/GPU senza supporto ai render target float (serve per il GPGPU).";
                return;
            }

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
            camera.position.set(0, 0, 3);
            camera.lookAt(0, 0, 0);
            const group = new THREE.Group();
            scene.add(group);

            // ----- scena di simulazione condivisa (un quad, gli swappiamo i material) -----
            const simScene = new THREE.Scene();
            const simCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
            simScene.add(quad);
            function renderToRT(mat, rt) {
                quad.material = mat;
                renderer.setRenderTarget(rt);
                renderer.render(simScene, simCamera);
                renderer.setRenderTarget(null);
            }

            // ======================================================================
            // GEOMETRIA DELLA "D"  (qui, nel tuo progetto, useresti il TUO modello —
            // vedi nota in fondo: MeshSurfaceSampler + offset lungo la normale)
            // ======================================================================
            const D = { yT: 0.95, xL: -0.72, outW: 1.5, xIn: -0.40, inW: 1.05, yIn: 0.62, zHalf: 0.18 };
            function insideD(x, y) {
                if (y < -D.yT || y > D.yT || x < D.xL) return false;
                const t = 1.0 - (y / D.yT) * (y / D.yT);
                if (t < 0) return false;
                if (x > D.xL + D.outW * Math.sqrt(t)) return false;
                if (y > -D.yIn && y < D.yIn && x > D.xIn) {
                    const ti = 1.0 - (y / D.yIn) * (y / D.yIn);
                    if (ti > 0 && x < D.xIn + D.inW * Math.sqrt(ti)) return false;
                }
                return true;
            }
            function randXYInside() {
                while (true) {
                    const x = D.xL + Math.random() * D.outW;
                    const y = -D.yT + Math.random() * (2 * D.yT);
                    if (insideD(x, y)) return [x, y];
                }
            }

            // --- STRATO 1: corpo viola = VOLUME pieno (denso, sembra solido) ---
            function makeBodyPositions(count) {
                const data = new Float32Array(count * 4);
                for (let i = 0; i < count; i++) {
                    const [x, y] = randXYInside();
                    const z = (Math.random() * 2 - 1) * D.zHalf;
                    data[i * 4 + 0] = x + (Math.random() * 2 - 1) * 0.018;
                    data[i * 4 + 1] = y + (Math.random() * 2 - 1) * 0.018;
                    data[i * 4 + 2] = z + (Math.random() * 2 - 1) * 0.018;
                    data[i * 4 + 3] = 1.0;
                }
                return data;
            }

            // --- STRATO 2: pelle ciano = SUPERFICIE (facce + bordo) spinta un filo in fuori ---
            function makeSkinPositions(count) {
                const data = new Float32Array(count * 4);
                const off = 0.04; // la pelle sta leggermente FUORI dal corpo
                for (let i = 0; i < count; i++) {
                    let x, y, z;
                    const r = Math.random();
                    if (r < 0.6) {                              // facce frontale/posteriore
                        [x, y] = randXYInside();
                        z = (Math.random() < 0.5 ? 1 : -1) * (D.zHalf + off);
                    } else {                                    // bordo (sagoma)
                        y = (Math.random() * 2 - 1) * D.yT;
                        if (Math.random() < 0.45) x = D.xL - off; // lato dritto sinistro
                        else {                                    // arco esterno destro
                            const t = Math.max(0, 1 - (y / D.yT) * (y / D.yT));
                            x = D.xL + D.outW * Math.sqrt(t) + off;
                        }
                        z = (Math.random() * 2 - 1) * D.zHalf;
                    }
                    data[i * 4 + 0] = x + (Math.random() * 2 - 1) * 0.012;
                    data[i * 4 + 1] = y + (Math.random() * 2 - 1) * 0.012;
                    data[i * 4 + 2] = z + (Math.random() * 2 - 1) * 0.012;
                    data[i * 4 + 3] = 1.0;
                }
                return data;
            }

            // ======================================================================
            // SHADER CONDIVISI (GPGPU + render dei punti)
            // ======================================================================
            const SIM_VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

            const VEL_FRAG = `
      uniform sampler2D positions, velocities, origin;
      uniform vec3  uMouse;
      uniform float uTime, uDt, uSpring, uDamping, uPush, uRadius, uMaxSpeed, uTurbBase, uTurbMove;
      varying vec2 vUv;
      void main(){
        vec3 pos  = texture2D(positions,  vUv).xyz;
        vec3 vel  = texture2D(velocities, vUv).xyz;
        vec3 home = texture2D(origin,     vUv).xyz;
        vec3 toHome = home - pos;
        vec3 acc = toHome * uSpring;                       // molla -> rigenerazione
        vec3 fromMouse = pos - uMouse;                     // repulsione mouse -> dispersione
        float d = length(fromMouse);
        if (d < uRadius){ float f = 1.0 - d/uRadius; acc += normalize(fromMouse + 1e-5) * (f*f) * uPush; }
        float disp = clamp(length(toHome) * 3.0, 0.0, 1.0);
        vec3 turb = vec3(sin(pos.y*6.0+uTime*1.3), sin(pos.z*6.0+uTime*1.7), sin(pos.x*6.0+uTime*1.1));
        acc += turb * (uTurbBase + uTurbMove * disp);
        vel += acc * uDt;
        vel *= exp(-uDamping * uDt);
        float sp = length(vel);
        if (sp > uMaxSpeed) vel *= uMaxSpeed / sp;
        gl_FragColor = vec4(vel, 1.0);
      }`;

            const POS_FRAG = `
      uniform sampler2D positions, velocities;
      uniform float uDt;
      varying vec2 vUv;
      void main(){
        vec3 pos = texture2D(positions, vUv).xyz;
        vec3 vel = texture2D(velocities, vUv).xyz;
        gl_FragColor = vec4(pos + vel * uDt, 1.0);
      }`;

            const POINT_VERT = `
      attribute vec3 ref;
      uniform sampler2D positionTex, velocityTex;
      uniform float uSize, uPR;
      varying float vSpeed, vRand;
      void main(){
        vec3 p = texture2D(positionTex, ref.xy).xyz;
        vSpeed = length(texture2D(velocityTex, ref.xy).xyz);
        vRand  = ref.z;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = uSize * uPR * (0.6 + 0.8 * ref.z) / max(-mv.z, 0.001);
      }`;

            const POINT_FRAG = `
      uniform vec3 uCold, uHot;
      uniform float uAlpha;
      varying float vSpeed, vRand;
      void main(){
        vec2 c = gl_PointCoord - 0.5;
        float r = length(c);
        if (r > 0.5) discard;
        float a = smoothstep(0.5, 0.08, r);
        float t = clamp(vSpeed * 0.55, 0.0, 1.0);          // colore guidato dalla velocita'
        vec3 col = mix(uCold, uHot, t);
        col *= (1.0 + vSpeed * 0.40);                      // i veloci brillano (verso bianco)
        col *= (0.75 + 0.5 * vRand);
        gl_FragColor = vec4(col, a * uAlpha);
      }`;

            // ======================================================================
            // FABBRICA DI UNO STRATO: crea sim GPGPU + punti per una config
            // ======================================================================
            function createLayer(cfg, homeData) {
                const N = cfg.size * cfg.size;

                const originTex = new THREE.DataTexture(homeData, cfg.size, cfg.size, THREE.RGBAFormat, THREE.FloatType);
                originTex.minFilter = originTex.magFilter = THREE.NearestFilter;
                originTex.needsUpdate = true;

                const makeRT = () => new THREE.WebGLRenderTarget(cfg.size, cfg.size, {
                    minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                    format: THREE.RGBAFormat, type: THREE.FloatType, depthBuffer: false, stencilBuffer: false,
                });
                let posCur = makeRT(), posNext = makeRT(), velCur = makeRT(), velNext = makeRT();

                const velMat = new THREE.ShaderMaterial({
                    uniforms: {
                        positions: { value: null }, velocities: { value: null }, origin: { value: originTex },
                        uMouse: { value: new THREE.Vector3(999, 999, 999) }, uTime: { value: 0 }, uDt: { value: 0 },
                        uSpring: { value: cfg.spring }, uDamping: { value: cfg.damping }, uPush: { value: cfg.push },
                        uRadius: { value: cfg.radius }, uMaxSpeed: { value: cfg.maxSpeed },
                        uTurbBase: { value: cfg.turbBase }, uTurbMove: { value: cfg.turbMove },
                    },
                    vertexShader: SIM_VERT, fragmentShader: VEL_FRAG,
                });
                const posMat = new THREE.ShaderMaterial({
                    uniforms: { positions: { value: null }, velocities: { value: null }, uDt: { value: 0 } },
                    vertexShader: SIM_VERT, fragmentShader: POS_FRAG,
                });
                const initPosMat = new THREE.ShaderMaterial({
                    uniforms: { src: { value: originTex } }, vertexShader: SIM_VERT,
                    fragmentShader: `uniform sampler2D src; varying vec2 vUv; void main(){ gl_FragColor = texture2D(src, vUv); }`,
                });
                const initVelMat = new THREE.ShaderMaterial({
                    vertexShader: SIM_VERT, fragmentShader: `void main(){ gl_FragColor = vec4(0.0); }`,
                });

                // seeding: posizioni = casa, velocita' = 0
                renderToRT(initPosMat, posCur); renderToRT(initPosMat, posNext);
                renderToRT(initVelMat, velCur); renderToRT(initVelMat, velNext);

                // geometria dei punti
                const refs = new Float32Array(N * 3), dummy = new Float32Array(N * 3);
                for (let k = 0; k < N; k++) {
                    refs[k * 3 + 0] = ((k % cfg.size) + 0.5) / cfg.size;
                    refs[k * 3 + 1] = (Math.floor(k / cfg.size) + 0.5) / cfg.size;
                    refs[k * 3 + 2] = Math.random();
                }
                const geo = new THREE.BufferGeometry();
                geo.setAttribute("position", new THREE.BufferAttribute(dummy, 3));
                geo.setAttribute("ref", new THREE.BufferAttribute(refs, 3));

                const pointsMat = new THREE.ShaderMaterial({
                    uniforms: {
                        positionTex: { value: posCur.texture }, velocityTex: { value: velCur.texture },
                        uSize: { value: cfg.pointSize }, uPR: { value: PR },
                        uCold: { value: new THREE.Vector3(...cfg.cold) }, uHot: { value: new THREE.Vector3(...cfg.hot) },
                        uAlpha: { value: cfg.alpha },
                    },
                    vertexShader: POINT_VERT, fragmentShader: POINT_FRAG,
                    transparent: cfg.transparent, depthTest: true, depthWrite: cfg.depthWrite, blending: cfg.blending,
                });
                const points = new THREE.Points(geo, pointsMat);
                points.frustumCulled = false;
                points.renderOrder = cfg.renderOrder || 0;

                function simulate(dt, time, mouseLocal) {
                    velMat.uniforms.positions.value = posCur.texture;
                    velMat.uniforms.velocities.value = velCur.texture;
                    velMat.uniforms.uMouse.value.copy(mouseLocal);
                    velMat.uniforms.uTime.value = time; velMat.uniforms.uDt.value = dt;
                    renderToRT(velMat, velNext);

                    posMat.uniforms.positions.value = posCur.texture;
                    posMat.uniforms.velocities.value = velNext.texture;
                    posMat.uniforms.uDt.value = dt;
                    renderToRT(posMat, posNext);

                    let tp = posCur; posCur = posNext; posNext = tp;
                    let tv = velCur; velCur = velNext; velNext = tv;
                    pointsMat.uniforms.positionTex.value = posCur.texture;
                    pointsMat.uniforms.velocityTex.value = velCur.texture;
                }
                return { points, simulate };
            }

            // ======================================================================
            // I DUE STRATI
            // ======================================================================
            // CORPO: denso, viola, calmo, OPACO (occlude -> sembra un solido)
            const body = createLayer({
                size: 320,                 // 102.400 particelle
                spring: 26, damping: 5.5, push: 30, radius: 0.50, maxSpeed: 4.0,
                turbBase: 0.20, turbMove: 0.9,
                pointSize: 4.5, alpha: 1.0,
                cold: [0.40, 0.28, 0.85], hot: [0.55, 0.75, 1.0],   // viola -> azzurro/bianco
                blending: THREE.NormalBlending, transparent: false, depthWrite: true, renderOrder: 0,
            }, makeBodyPositions(320 * 320));

            // PELLE: superficie, ciano, nervosa, ADDITIVA (glow sopra il corpo), vola via per prima
            const skin = createLayer({
                size: 256,                 // 65.536 particelle
                spring: 20, damping: 3.5, push: 58, radius: 0.55, maxSpeed: 4.5,
                turbBase: 0.45, turbMove: 1.6,
                pointSize: 6.0, alpha: 0.5,
                cold: [0.25, 0.95, 0.95], hot: [0.9, 1.0, 1.0],     // ciano -> bianco
                blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, renderOrder: 1,
            }, makeSkinPositions(256 * 256));

            group.add(body.points);
            group.add(skin.points);

            // ======================================================================
            // MOUSE in spazio MODELLO + rotazione
            // ======================================================================
            const raycaster = new THREE.Raycaster();
            const ndc = new THREE.Vector2(2, 2);
            let pointerInside = false;
            function updatePointer(e) {
                const r = renderer.domElement.getBoundingClientRect();
                ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
                ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
                pointerInside = true;
            }
            renderer.domElement.addEventListener("pointermove", updatePointer);
            renderer.domElement.addEventListener("pointerleave", () => { pointerInside = false; });

            const planeNormal = new THREE.Vector3(), plane = new THREE.Plane();
            const hitWorld = new THREE.Vector3(), mouseLocal = new THREE.Vector3(999, 999, 999);
            function computeMouseLocal() {
                if (!pointerInside) { mouseLocal.set(999, 999, 999); return; }
                camera.getWorldDirection(planeNormal);
                plane.setFromNormalAndCoplanarPoint(planeNormal, new THREE.Vector3(0, 0, 0));
                raycaster.setFromCamera(ndc, camera);
                if (raycaster.ray.intersectPlane(plane, hitWorld)) {
                    group.updateMatrixWorld();
                    mouseLocal.copy(group.worldToLocal(hitWorld.clone()));
                } else mouseLocal.set(999, 999, 999);
            }

            let dragging = false, lastX = 0, lastY = 0, rotX = 0, rotY = 0;
            renderer.domElement.addEventListener("pointerdown", (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
            window.addEventListener("pointerup", () => { dragging = false; });
            window.addEventListener("pointermove", (e) => {
                if (!dragging) return;
                rotY += (e.clientX - lastX) * 0.005;
                rotX = Math.max(-1.0, Math.min(1.0, rotX + (e.clientY - lastY) * 0.005));
                lastX = e.clientX; lastY = e.clientY;
            });

            // ----- LOOP -----
            const clock = new THREE.Clock();
            function loop() {
                requestAnimationFrame(loop);
                const dt = Math.min(clock.getDelta(), 0.033);
                const t = clock.elapsedTime;
                if (!dragging) rotY += 0.12 * dt;
                group.rotation.set(rotX, rotY, 0);
                computeMouseLocal();
                body.simulate(dt, t, mouseLocal);
                skin.simulate(dt, t, mouseLocal);
                renderer.render(scene, camera);
            }
            loop();

            window.addEventListener("resize", () => {
                camera.aspect = innerWidth / innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
            });
        })();
    </script>
</body>

</html>
