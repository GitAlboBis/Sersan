<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="SERSAN">
  <title>SERSAN</title>

  <!-- The mark is the brand's two-tone as drawn: a near-black half against a
       blue one. That reading only survives on a light tab strip, so the icon
       inverts the dark half to ink when the browser chrome is dark. Geometry is
       the same outline as src/components/sersan-logo.tsx and the 3D mark. -->
  <style>
    .upper { fill: #132741; }
    .lower { fill: #2280DC; }
    @media (prefers-color-scheme: dark) {
      .upper { fill: #F4F6FA; }
      .lower { fill: #4FA3F7; }
    }
  </style>

  <g transform="translate(28.55 12) scale(0.88)">
    <path class="upper" d="M 81.19 0 L 162.38 46.88 L 127.3 67.13 L 81.19 40.51 L 39.64 64.49 L 39.64 90.03 L 80.11 113.4 L 40.6 136.21 L 0 112.78 L 0 46.88 Z"/>
    <path class="lower" d="M 81.19 200 L 0 153.13 L 35.08 132.87 L 81.19 159.49 L 122.73 135.51 L 122.73 109.97 L 82.27 86.6 L 121.78 63.79 L 162.38 87.22 L 162.38 153.13 Z"/>
  </g>
</svg>
